# One of: debug, verbose, info, warn, error.
# "verbose" sits between debug and info: it enables extra connection-flow
# logging (IPSC listener/peer lifecycle, MMDVM connect/reconnect attempts,
# ...) without the much higher-volume per-packet logging that "debug"
# also turns on. Useful for debugging connectivity issues without being
# flooded by per-packet dumps.
log-level: info

ipsc:
  interface: "ipsc0"
  port: 50000
  ip: "10.10.250.1"
  subnet-mask: 24
  auth:
    enabled: false
    key: ""

  # When true, the connections to the DMR network servers configured
  # below (mmdvm) are only opened while a repeater is registered with
  # the IPSC server, and are closed again once the repeater disconnects.
  # When false (default), DMR network connections are opened immediately
  # at startup regardless of repeater state.
  require-repeater: false
  # Seconds of inactivity after which a registered repeater is considered
  # disconnected and removed (with require-repeater, the DMR network
  # connections are also closed).
  repeater-timeout: 90

metrics:
  enabled: false
  address: ":9100"

mmdvm:
  - name: "BrandMeister"
    master-server: "3104.master.brandmeister.network:62031"
    password: "passw0rd"

    callsign: N0CALL
    radio-id: 185925701

    # Frequency in Hz:
    rx-freq: 429075000
    tx-freq: 424075000

    # TX power in dBm (optional):
    # tx-power: 30

    color-code: 7
    # Optional latitude and longitude:
    # latitude: 30.000000
    # longitude: -97.000000

    # Height in meters:
    height: 3

    # Optional location:
    location: "Moore, OK"

    # Optional description:
    # description: ""

    # Optional URL:
    # url: ""

    # DMRGateway-style rewrite rules (optional).
    # Each rule has: from-slot, from-tg/id, to-slot, to-tg/id, range.
    # TGRewrite: rewrite group talkgroup calls
    # tg-rewrite:
    #   - from-slot: 1
    #     from-tg: 9
    #     to-slot: 1
    #     to-tg: 9
    #     range: 1
    # PCRewrite: rewrite private calls by destination ID
    # pc-rewrite:
    #   - from-slot: 1
    #     from-id: 100
    #     to-slot: 1
    #     to-id: 200
    #     range: 1
    # TypeRewrite: convert group TG calls to private calls
    # type-rewrite:
    #   - from-slot: 1
    #     from-tg: 9
    #     to-slot: 1
    #     to-id: 3100
    #     range: 1
    # SrcRewrite: match calls by source ID, remap source into a prefixed range
    # src-rewrite:
    #   - from-slot: 1
    #     from-id: 1234
    #     to-slot: 1
    #     to-id: 9
    #     range: 1

    # PassAll: let all traffic of a given type on a timeslot pass through
    # to this master unchanged, without configuring a rewrite rule per
    # talkgroup/ID. Each is a list of timeslots (1 and/or 2).
    # Example: forward all TS1 traffic to this master unchanged:
    # pass-all-tg: [1]       # all group-call traffic on TS1 passes through unchanged
    # pass-all-pc: [1]       # same, for private calls
    # Example: same, but for TS2 instead:
    # pass-all-tg: [2]       # all group-call traffic on TS2 passes through unchanged
    # pass-all-pc: [2]       # same, for private calls

  # Additional DMR masters can be added:
  # - name: "TGIF"
  #   master-server: "tgif.network:62031"
  #   password: "anotherpassword"
  #   callsign: KI5VMF
  #   radio-id: 319186803
  #   rx-freq: 429075000
  #   tx-freq: 424075000
  #   color-code: 7
  #   height: 3
  #   tg-rewrite:
  #     - from-slot: 2
  #       from-tg: 31665
  #       to-slot: 2
  #       to-tg: 31665
  #       range: 1
